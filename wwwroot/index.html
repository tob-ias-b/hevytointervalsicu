<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Hevy to intervals.icu</title>
  <style>
    :root {
      color-scheme: light;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      color: #1f2328;
      background: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      place-items: center;
      background: #ffffff;
    }

    main { width: min(820px, 100%); }
    .eyebrow {
      margin: 0 0 8px;
      color: #656d76;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 44px);
      letter-spacing: -0.03em;
      text-align: center;
    }

    .intro {
      margin: 14px 0 34px;
      color: #656d76;
      font-size: 16px;
      text-align: center;
    }

    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .choice {
      display: grid;
      min-height: 190px;
      align-content: center;
      gap: 10px;
      border: 1px solid #d1d9e0;
      border-radius: 6px;
      background: #fff;
      color: inherit;
      padding: 28px;
      text-align: center;
      text-decoration: none;
      transition: background-color 140ms ease, border-color 140ms ease;
    }

    .choice:hover, .choice:focus-visible {
      border-color: #656d76;
      background: #f6f8fa;
    }

    .choice:focus-visible { outline: 2px solid #afb8c1; outline-offset: 2px; }
    .choice strong { font-size: 20px; }
    .choice span { color: #656d76; font-size: 14px; line-height: 1.5; }

    @media (max-width: 580px) {
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 150px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">HEVY WORKOUT CONVERTER</p>
    <h1>Choose your version</h1>
    <p class="intro">Select how you want to bring your workouts into intervals.icu.</p>
    <nav class="choices" aria-label="Choose app version">
      <a class="choice" href="csvfeed/index.html">
        <strong>CSV Feed</strong>
        <span>Convert a Hevy workout export from a CSV file.</span>
      </a>
      <a class="choice" href="apifeed/index.html">
        <strong>API Feed</strong>
        <span>Fetch workouts from Hevy and select which to upload.</span>
      </a>
    </nav>
  </main>
</body>
</html>
