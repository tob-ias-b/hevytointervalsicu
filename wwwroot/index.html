<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f4">
  <title>Hevy to intervals.icu</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Aptos", "Segoe UI", sans-serif;
      color: #1d211c;
      background: #f7f8f4;
    }

    * { box-sizing: border-box; }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 20px;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(47, 107, 69, 0.06) 25%, transparent 25%) 0 0 / 24px 24px,
        #f7f8f4;
    }

    main { width: min(820px, 100%); }
    .eyebrow {
      margin: 0 0 8px;
      color: #2f6b45;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: Georgia, serif;
      font-size: clamp(32px, 7vw, 52px);
      text-align: center;
    }

    .intro {
      margin: 14px 0 34px;
      color: #687067;
      font-size: 16px;
      text-align: center;
    }

    .choices { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .choice {
      display: grid;
      min-height: 190px;
      align-content: center;
      gap: 10px;
      border: 1px solid #dfe4dc;
      border-radius: 24px;
      background: #fff;
      box-shadow: 0 10px 28px rgba(29, 33, 28, 0.07);
      color: inherit;
      padding: 28px;
      text-align: center;
      text-decoration: none;
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
    }

    .choice:hover, .choice:focus-visible {
      transform: translateY(-3px);
      border-color: #2f6b45;
      box-shadow: 0 14px 34px rgba(29, 33, 28, 0.12);
    }

    .choice:focus-visible { outline: 3px solid rgba(47, 107, 69, 0.28); outline-offset: 3px; }
    .choice strong { color: #2f6b45; font-size: 23px; }
    .choice span { color: #687067; font-size: 14px; line-height: 1.5; }

    @media (max-width: 580px) {
      .choices { grid-template-columns: 1fr; }
      .choice { min-height: 150px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">HEVY WORKOUT CONVERTER</p>
    <h1>Choose your version</h1>
    <p class="intro">Select how you want to bring your workouts into intervals.icu.</p>
    <nav class="choices" aria-label="Choose app version">
      <a class="choice" href="csvfeed/index.html">
        <strong>CSV Feed</strong>
        <span>Convert a Hevy workout export from a CSV file.</span>
      </a>
      <a class="choice" href="apifeed/index.html">
        <strong>API Feed</strong>
        <span>Fetch workouts from Hevy and select which to upload.</span>
      </a>
    </nav>
  </main>
</body>
</html>
